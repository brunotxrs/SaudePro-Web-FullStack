spring.config.import=optional:file:./config/db.properties
spring.application.name=SaudePro-Web-API

# ==========================================
# Ativando o livereload para navegador
# ==========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true 

# ==========================================
# Configura\u00e7oes do Banco de Dados
# ==========================================
spring.datasource.url=jdbc:mariadb://localhost:3306/saudepro_db?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# ==========================================
# Configura\u00e7oes do Hibernate / JPA
# ==========================================
# Cria ou atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# Configura\u00e7oes do PORT
# ==========================================
server.port=8080